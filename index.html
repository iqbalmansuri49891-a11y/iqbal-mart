<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iqbal Mart - Multi Vendor Marketplace</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
:root {
  --blue: #2874f0;
  --yellow: #ffc107;
  --bg: #f1f3f6;
  --card: #fff;
  --text: #212121;
  --muted: #777;
  --border: #e0e0e0;
  --green: #008c45;
}
body { background: var(--bg); color: var(--text); padding-bottom: 70px; }
header { background: var(--blue); color: white; padding: 10px 14px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.topbar { display: flex; align-items: center; gap: 10px; max-width: 1200px; margin: auto; }
.logo { font-size: 23px; font-weight: bold; white-space: nowrap; }
.logo span { color: var(--yellow); }
.search { flex: 1; display: flex; background: white; border-radius: 4px; overflow: hidden; }
.search input { width: 100%; border: 0; outline: none; padding: 12px; font-size: 15px; color: #222; }
.search button { width: 48px; border: 0; background: white; color: var(--blue); font-size: 20px; cursor: pointer; }
.header-btn { background: transparent; border: 0; color: white; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; }
.seller-btn { background: var(--yellow); color: #111; padding: 6px 12px; border-radius: 4px; font-weight: bold; }
.categories { background: var(--card); display: flex; gap: 22px; padding: 12px 15px; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none; }
.categories::-webkit-scrollbar { display: none; }
.category { min-width: 75px; text-align: center; cursor: pointer; font-size: 13px; color: var(--text); }
.category-icon { width: 48px; height: 48px; margin: auto auto 5px; border-radius: 50%; background: #eef4ff; display: flex; align-items: center; justify-content: center; font-size: 25px; }
.hero { max-width: 1200px; margin: 12px auto; padding: 0 12px; }
.hero-box { min-height: 180px; border-radius: 8px; padding: 30px; background: linear-gradient(110deg, #2874f0, #6aa0ff); color: white; display: flex; align-items: center; justify-content: space-between; overflow: hidden; }
.hero h1 { font-size: 30px; margin-bottom: 8px; }
.shop-btn { border: 0; background: var(--yellow); padding: 11px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; }
.section { max-width: 1200px; margin: 15px auto; padding: 0 12px; }
.section-title { background: var(--card); padding: 15px; border-bottom: 1px solid var(--border); font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
.products { background: var(--card); padding: 12px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.product { border: 1px solid var(--border); border-radius: 7px; overflow: hidden; background: var(--card); transition: .2s; cursor: pointer; position: relative; }
.product-img { height: 170px; background: #f8fafc; display: flex; align-items: center; justify-content: center; font-size: 75px; overflow: hidden; }
.product-img img { width: 100%; height: 100%; object-fit: cover; }
.product-info { padding: 10px; }
.product-name { font-size: 14px; min-height: 38px; line-height: 19px; }
.rating { display: inline-block; background: var(--green); color: white; padding: 3px 6px; border-radius: 4px; font-size: 12px; margin: 6px 0; }
.price { font-size: 18px; font-weight: bold; }
.old-price { color: var(--muted); text-decoration: line-through; font-size: 12px; margin-left: 5px; }
.discount { color: var(--green); font-size: 12px; margin-left: 5px; }
.wishlist { position: absolute; right: 8px; top: 8px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: white; font-size: 19px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 10; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2000; }
.cart { position: absolute; right: 0; top: 0; height: 100%; width: min(420px, 94%); background: var(--card); color: var(--text); display: flex; flex-direction: column; }
.cart-header { padding: 17px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 18px; }
.close { border: 0; background: transparent; font-size: 24px; cursor: pointer; }
.cart-items { flex: 1; overflow-y: auto; padding: 12px; }
.cart-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.cart-emoji { width: 65px; height: 65px; background: #f4f6f8; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 35px; overflow: hidden; }
.cart-emoji img { width: 100%; height: 100%; object-fit: cover; }
.cart-details { flex: 1; }
.qty { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.qty button { border: 0; background: var(--bg); width: 30px; height: 28px; cursor: pointer; }
.qty span { width: 32px; text-align: center; line-height: 28px; }
.remove { border: 0; background: transparent; color: #e53935; cursor: pointer; margin-top: 5px; font-size: 12px; }
.cart-footer { border-top: 1px solid var(--border); padding: 15px; }
.total { display: flex; justify-content: space-between; font-size: 19px; font-weight: bold; margin-bottom: 12px; }
.checkout { width: 100%; border: 0; background: #ff9f00; padding: 14px; font-weight: bold; cursor: pointer; border-radius: 4px; color: #111; }
.input-field { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid var(--border); border-radius: 6px; outline: none; font-size: 14px; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 3000; align-items: center; justify-content: center; padding: 15px; }
.modal { width: min(520px, 100%); max-height: 90vh; overflow-y: auto; background: var(--card); border-radius: 12px; padding: 25px; position: relative; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #222; color: white; padding: 12px 18px; border-radius: 6px; opacity: 0; pointer-events: none; transition: .25s; z-index: 5000; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media(max-width:650px){ .products { grid-template-columns: repeat(2, 1fr); } .header-btn { display:none; } }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="logo">Iqbal<span>Mart</span></div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Search products..." oninput="searchProducts()">
      <button onclick="searchProducts()">🔍</button>
    </div>
    <a href="admin.html" class="header-btn" style="background:#ff9f00; padding:6px 12px; border-radius:4px; font-weight:bold; color:#111;">📦 Orders & Admin</a>
    <button class="header-btn" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
  </div>
</header>

<div class="categories">
  <div class="category" onclick="filterCategory('All')"><div class="category-icon">🏠</div>All</div>
  <div class="category" onclick="filterCategory('Cameras')"><div class="category-icon">📷</div>Cameras</div>
  <div class="category" onclick="filterCategory('Fashion')"><div class="category-icon">👕</div>Fashion</div>
  <div class="category" onclick="filterCategory('Tools')"><div class="category-icon">🛠️</div>Tools</div>
  <div class="category" onclick="filterCategory('Electrical')"><div class="category-icon">⚡</div>Electrical</div>
  <div class="category" onclick="filterCategory('Mobiles')"><div class="category-icon">📱</div>Mobiles</div>
</div>

<section class="hero">
  <div class="hero-box">
    <div>
      <h1>Multi-Vendor Mega Sale!</h1>
      <p>Fast Delivery & Best Quality Products</p>
    </div>
    <div style="font-size:75px;">🛍️</div>
  </div>
</section>

<section class="section" id="productsSection">
  <div class="section-title">
    <span>Best Deals</span>
  </div>
  <div class="products" id="productGrid"></div>
</section>

<!-- CART OVERLAY -->
<div class="overlay" id="cartOverlay" onclick="closeCartOutside(event)">
  <div class="cart">
    <div class="cart-header">
      <span>🛒 My Cart</span>
      <button class="close" onclick="closeCart()">×</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div style="margin-bottom: 10px;">
        <input type="text" id="cust-name" placeholder="Full Name" class="input-field" style="margin-top:4px;">
        <input type="tel" id="cust-phone" placeholder="Mobile Number" class="input-field" style="margin-top:6px;">
        <input type="text" id="cust-address" placeholder="Delivery Address" class="input-field" style="margin-top:6px;">
      </div>
      <div class="total"><span>Total</span><span>₹<span id="cartTotal">0</span></span></div>
      <button class="checkout" onclick="proceedToCheckout()">PAY VIA RAZORPAY</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyALVuRv4qKbafSKz9ZqULjuvENYXtTXFvc",
    authDomain: "iqbal-mart-4324e.firebaseapp.com",
    projectId: "iqbal-mart-4324e",
    storageBucket: "iqbal-mart-4324e.firebasestorage.app",
    messagingSenderId: "970971077102",
    appId: "1:970971077102:web:7ab797480fd370a0c296ff",
    measurementId: "G-8S0GCRK0M3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let products = [];
  let cart = JSON.parse(localStorage.getItem("iqbal_cart") || "[]");
  let wishlist = JSON.parse(localStorage.getItem("iqbal_wishlist") || "[]");
  let currentProducts = [];

  async function loadFirebaseProducts() {
    try {
      const querySnapshot = await getDocs(collection(db, "products"));
      products = [];
      querySnapshot.forEach((doc) => {
        products.push({ id: doc.id, ...doc.data() });
      });
      currentProducts = [...products];
      renderProducts(currentProducts);
    } catch (e) {
      console.log("Error loading products:", e);
    }
  }

  window.renderProducts = function(list) {
    const grid = document.getElementById("productGrid");
    if (!list.length) {
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#777;">No products found.</div>`;
      return;
    }
    grid.innerHTML = list.map(product => {
      const liked = wishlist.includes(product.id);
      const displayMedia = product.image ? `<img src="${product.image}" alt="${product.name}">` : `<span style="font-size:65px;">${product.emoji || '📦'}</span>`;
      return `
        <div class="product">
          <button class="wishlist" onclick="toggleWishlist(event, '${product.id}')">${liked ? "❤️" : "♡"}</button>
          <div class="product-img">${displayMedia}</div>
          <div class="product-info">
            <div class="product-name">${product.name}</div>
            <span class="rating">⭐ ${product.rating || 4.5}</span>
            <div>
              <span class="price">₹${product.price.toLocaleString("en-IN")}</span>
              ${product.oldPrice ? `<span class="old-price">₹${product.oldPrice.toLocaleString("en-IN")}</span>` : ''}
            </div>
            <button onclick="addToCart('${product.id}')" style="width:100%; margin-top:8px; background:#ffc107; border:0; padding:8px; border-radius:4px; font-weight:bold; cursor:pointer;">ADD TO CART</button>
          </div>
        </div>
      `;
    }).join("");
  }

  window.searchProducts = function() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    currentProducts = products.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
    renderProducts(currentProducts);
  }

  window.filterCategory = function(cat) {
    if (cat === "All") currentProducts = [...products];
    else currentProducts = products.filter(p => p.category === cat);
    renderProducts(currentProducts);
  }

  window.addToCart = function(id) {
    const existing = cart.find(item => item.id == id);
    if (existing) existing.qty++; else cart.push({ id: id, qty: 1 });
    saveCart();
    showToast("Added to cart");
    renderCart();
  }

  window.saveCart = function() {
    localStorage.setItem("iqbal_cart", JSON.stringify(cart));
    updateCartCount();
  }

  window.updateCartCount = function() {
    const count = cart.reduce((sum, item) => sum + item.qty, 0);
    document.getElementById("cartCount").textContent = count;
  }

  window.openCart = function() { renderCart(); document.getElementById("cartOverlay").style.display = "block"; }
  window.closeCart = function() { document.getElementById("cartOverlay").style.display = "none"; }
  window.closeCartOutside = function(event) { if (event.target.id === "cartOverlay") closeCart(); }

  window.renderCart = function() {
    const container = document.getElementById("cartItems");
    if (!cart.length) {
      container.innerHTML = `<div style="text-align:center; padding:30px; color:#777;">Your cart is empty.</div>`;
      document.getElementById("cartTotal").textContent = "0";
      return;
    }
    let total = 0;
    container.innerHTML = cart.map(item => {
      const product = products.find(p => p.id == item.id);
      if (!product) return "";
      total += product.price * item.qty;
      const media = product.image ? `<img src="${product.image}" style="width:100%;height:100%;object-fit:cover;">` : `📦`;
      return `
        <div class="cart-item">
          <div class="cart-emoji">${media}</div>
          <div class="cart-details">
            <div style="font-size:14px;font-weight:bold;">${product.name}</div>
            <div>₹${product.price.toLocaleString("en-IN")}</div>
            <div class="qty" style="margin-top:4px;">
              <button onclick="changeQty('${product.id}', -1)">−</button>
              <span>${item.qty}</span>
              <button onclick="changeQty('${product.id}', 1)">+</button>
            </div><br>
            <button class="remove" onclick="removeFromCart('${product.id}')">Remove</button>
          </div>
        </div>
      `;
    }).join("");
    document.getElementById("cartTotal").textContent = total.toLocaleString("en-IN");
  }

  window.changeQty = function(id, change) {
    const item = cart.find(i => i.id == id);
    if (!item) return;
    item.qty += change;
    if (item.qty <= 0) cart = cart.filter(i => i.id != id);
    saveCart(); renderCart();
  }

  window.removeFromCart = function(id) {
    cart = cart.filter(i => i.id != id);
    saveCart(); renderCart();
  }

  window.toggleWishlist = function(event, id) {
    event.stopPropagation();
    if (wishlist.includes(id)) wishlist = wishlist.filter(x => x != id);
    else wishlist.push(id);
    localStorage.setItem("iqbal_wishlist", JSON.stringify(wishlist));
    renderProducts(currentProducts);
  }

  window.proceedToCheckout = async function() {
    if (!cart.length) { showToast("Cart is empty"); return; }
    const name = document.getElementById('cust-name').value.trim();
    const phone = document.getElementById('cust-phone').value.trim();
    const address = document.getElementById('cust-address').value.trim();
    if (!name || !phone || !address) { alert("Kripya poora naam, phone aur address bharein!"); return; }

    let total = 0;
    cart.forEach(item => {
      const p = products.find(prod => prod.id == item.id);
      if (p) total += p.price * item.qty;
    });

    let orders = JSON.parse(localStorage.getItem("iqbal_orders") || "[]");
    const orderId = "ORD" + Date.now();
    const newOrder = { id: orderId, date: new Date().toLocaleString(), items: [...cart], total, shipping: { name, phone, address }, status: "✅ Order Placed" };
    orders.unshift(newOrder);
    localStorage.setItem("iqbal_orders", JSON.stringify(orders));

    cart = []; saveCart(); updateCartCount(); closeCart();
    alert("✅ Order Placed Successfully! Order ID: " + orderId);
  }

  window.showToast = function(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  loadFirebaseProducts();
  updateCartCount();
</script>
</body>
</html>
