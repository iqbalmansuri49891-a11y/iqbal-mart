<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2874f0">
<title>Iqbal Mart — Multi Vendor Marketplace</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root{--blue:#2874f0;--yellow:#ffc107;--bg:#f1f3f6;--card:#fff;--text:#212121;--muted:#687080;--border:#e0e4ea;--green:#078447;--red:#d93025;--shadow:0 5px 20px #14213d12}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:72px}
body.dark{--bg:#101722;--card:#1b2635;--text:#f4f7fb;--muted:#b6c0ce;--border:#344255;--shadow:0 5px 20px #0003}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
header{position:sticky;top:0;z-index:100;background:var(--blue);color:#fff;padding:12px;box-shadow:var(--shadow)}
.topbar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:800;white-space:nowrap}.logo span{color:var(--yellow)}
.search{display:flex;flex:1;min-width:160px;background:#fff;border-radius:6px;overflow:hidden}.search input{border:0;outline:0;padding:12px;width:100%;color:#222}.search button{border:0;background:#fff;padding:0 14px;color:var(--blue)}
.header-btn{border:0;background:transparent;color:#fff;padding:8px 6px;font-weight:600}.seller-btn{background:var(--yellow);color:#171717;border-radius:6px;padding:9px 12px}
.categories{display:flex;gap:18px;overflow:auto;padding:12px;background:var(--card);border-bottom:1px solid var(--border)}
.category{border:0;background:transparent;color:var(--text);min-width:64px;text-align:center;font-size:12px}.category-icon{display:grid;place-items:center;margin:0 auto 5px;width:44px;height:44px;border-radius:50%;background:#eaf1ff;font-size:23px}
.hero,.section{max-width:1200px;margin:14px auto;padding:0 12px}
.hero-box{border-radius:12px;padding:26px;background:linear-gradient(115deg,#2874f0,#6aa5ff);color:white;display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:160px}
.hero-box h1{font-size:clamp(22px,4vw,34px);margin-bottom:8px}.hero-box p{margin-bottom:14px;line-height:1.5}.shop-btn{border:0;background:var(--yellow);padding:11px 16px;border-radius:6px;font-weight:bold}
.section-title{background:var(--card);padding:14px;border-bottom:1px solid var(--border);font-size:19px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:8px}
.products{background:var(--card);padding:12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.product{min-width:0;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.product-img{height:165px;background:#f7f9fc;display:grid;place-items:center;font-size:60px;overflow:hidden;color:#687080}
.product-img img{width:100%;height:100%;object-fit:contain}
.product-info{padding:10px;display:flex;flex-direction:column;gap:7px;flex:1}.product-name{font-size:14px;line-height:1.4;overflow-wrap:anywhere}.product-desc{font-size:12px;color:var(--muted);line-height:1.4}.price{font-size:18px;font-weight:bold}.small-muted{font-size:11px;color:var(--muted)}
.btn{border:0;border-radius:6px;padding:10px 12px;font-weight:700}.btn-blue{background:var(--blue);color:#fff}.btn-yellow{background:var(--yellow);color:#171717}.btn-light{background:var(--bg);color:var(--text);border:1px solid var(--border)}.btn-red{background:var(--red);color:#fff}.btn-block{width:100%}
.empty{grid-column:1/-1;padding:28px;text-align:center;color:var(--muted)}
.overlay,.modal-bg{display:none;position:fixed;inset:0;background:#0009;z-index:3000;padding:14px;align-items:center;justify-content:center}.overlay{z-index:2500}
.cart{margin-left:auto;height:100%;width:min(430px,100%);background:var(--card);color:var(--text);display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.cart-header,.modal-head{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);gap:12px}
.close{border:0;background:transparent;color:var(--text);font-size:27px;line-height:1}
.cart-items{flex:1;overflow:auto;padding:12px}.cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.cart-thumb{width:64px;height:64px;flex-shrink:0;background:var(--bg);border-radius:6px;overflow:hidden;display:grid;place-items:center}.cart-thumb img{width:100%;height:100%;object-fit:contain}.cart-details{flex:1;min-width:0}.qty{display:flex;align-items:center;gap:10px;margin-top:8px}.qty button{width:28px;height:28px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:4px}.cart-footer{border-top:1px solid var(--border);padding:15px}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;margin-bottom:12px}
.modal{width:min(540px,100%);max-height:92vh;overflow:auto;background:var(--card);color:var(--text);border-radius:12px;box-shadow:var(--shadow)}.modal-body{padding:18px}.modal h2{font-size:22px;margin-bottom:8px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.field{width:100%;padding:12px;margin-top:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);outline-color:var(--blue)}.form-row{display:flex;gap:10px}.form-row>*{flex:1;min-width:0}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}
.plan-card{padding:14px;border:1px solid var(--border);border-radius:8px;margin-top:10px;cursor:pointer}.plan-card.active{border:2px solid var(--blue);background:#edf4ff;color:#182b4d}.toast{position:fixed;bottom:85px;left:50%;transform:translate(-50%,15px);background:#20252d;color:white;padding:12px 18px;border-radius:8px;z-index:6000;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--card);border-top:1px solid var(--border);z-index:1200;justify-content:space-around}.bottom-nav button{border:0;background:transparent;color:var(--muted);font-size:11px}.nav-icon{display:block;font-size:21px;margin-bottom:2px}
#authGate{position:fixed;inset:0;z-index:5000;background:linear-gradient(135deg,#1e3c72,#2a5298);display:none;align-items:center;justify-content:center;padding:18px}
#authGate .modal{background:var(--card);width:min(430px,100%)}.error{color:var(--red);font-size:13px;margin-top:10px;white-space:pre-wrap}
@media(max-width:950px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}.product-img{height:145px}.header-btn.hide-mobile{display:none}.topbar{gap:7px}.search{order:5;flex-basis:100%}.hero-box{padding:20px}.hero-emoji{font-size:48px!important}.bottom-nav{display:flex}.section-title{font-size:17px}.section-title .btn{padding:8px;font-size:12px}}
@media(max-width:360px){.logo{font-size:19px}.product-img{height:120px}.hero-box{padding:15px}}

/* Iqbal Mart premium marketplace refresh */
:root{--blue:#1769e8;--yellow:#ffcf33;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#69758a;--border:#e6ebf2;--shadow:0 8px 28px #19345b12}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);letter-spacing:-.1px}
header{background:linear-gradient(100deg,#0755c9,#287df2);padding:12px 16px;box-shadow:0 4px 18px #1254a52b}
.topbar{gap:14px}
.logo{font-size:25px;letter-spacing:-1px}
.logo span{color:#ffdf69}
.search{border-radius:10px;box-shadow:0 2px 8px #001b4b12}
.search input{padding:13px 14px}
.search button{padding:0 16px}
.header-btn{border-radius:8px;transition:background .18s}
.header-btn:hover{background:#ffffff20}
.seller-btn{box-shadow:0 3px 0 #d4a500;font-weight:800}
.categories{justify-content:center;gap:clamp(12px,3vw,34px);padding:14px 12px;background:var(--card);box-shadow:0 4px 16px #14213d08}
.category{font-weight:700;min-width:66px;transition:transform .18s,color .18s}
.category:hover{color:var(--blue);transform:translateY(-2px)}
.category-icon{width:52px;height:52px;background:linear-gradient(145deg,#edf4ff,#dce9ff);border:1px solid #d7e5ff;box-shadow:0 3px 10px #1b64c50d}
.hero{margin-top:18px}
.hero-box{position:relative;overflow:hidden;min-height:210px;border-radius:18px;padding:clamp(22px,4vw,42px);background:radial-gradient(circle at 85% 20%,#ffffff45 0 3%,transparent 3.5%),radial-gradient(circle at 78% 90%,#ffffff26 0 13%,transparent 13.5%),linear-gradient(115deg,#074cb8 0%,#1769e8 55%,#5ca7ff 100%);box-shadow:0 14px 32px #1769e826}
.hero-box:after{content:"";position:absolute;right:12%;top:-70px;width:230px;height:230px;border:1px solid #ffffff30;border-radius:50%;box-shadow:0 0 0 28px #ffffff0d,0 0 0 58px #ffffff0a;pointer-events:none}
.hero-box h1{font-size:clamp(27px,5vw,43px);font-weight:850;letter-spacing:-1.4px}
.hero-box p{max-width:540px;color:#eef5ff;font-size:15px}
.hero-emoji{filter:drop-shadow(0 12px 10px #002e7250);z-index:1}
.shop-btn{border-radius:9px;padding:12px 20px;box-shadow:0 4px 0 #d6a800;transition:transform .15s}
.shop-btn:active,.btn:active{transform:scale(.98)}
.section{margin-top:18px}
.section-title{border-radius:12px 12px 0 0;border-bottom:2px solid #edf1f7;padding:17px 18px;font-size:20px}
.products{border-radius:0 0 12px 12px;padding:14px;gap:14px}
.product{border-radius:12px;border-color:#edf0f5;box-shadow:0 2px 9px #12294b08;transition:transform .18s,box-shadow .18s,border-color .18s}
.product:hover{transform:translateY(-4px);box-shadow:0 12px 25px #153d7217;border-color:#d7e5ff}
.product-img{height:190px;background:linear-gradient(145deg,#fbfcff,#f0f5fc);padding:10px}
.product-img img{transition:transform .25s}
.product:hover .product-img img{transform:scale(1.04)}
.product-info{padding:13px}
.product-name{font-size:14px;font-weight:650;line-height:1.45}
.price{font-size:19px;letter-spacing:-.4px;color:var(--text)}
.btn{transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(.97)}
.btn-blue{background:linear-gradient(100deg,#1769e8,#3988ff)}
.btn-yellow{background:linear-gradient(100deg,#ffcf33,#ffe17a)}
.modal{border-radius:16px}
.field{border-radius:9px}
.bottom-nav{box-shadow:0 -5px 20px #10274a0b}
@media(max-width:700px){.categories{justify-content:flex-start}.hero-box{min-height:185px}.product-img{height:155px}.products{gap:9px}.section-title{padding:14px}}
@media(max-width:360px){.product-img{height:125px}}
</style>
</head>
