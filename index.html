<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iqbal Mart</title>
  <!-- Razorpay Checkout Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    :root {
      --yellow: #ff9f00;
      --bg: #f1f3f6;
      --card: #ffffff;
      --text: #212121;
      --muted: #878787;
      --border: #e0e0e0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #2874f0;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .container {
      padding: 15px;
      max-width: 800px;
      margin: auto;
    }
    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button {
      background-color: var(--yellow);
      border: none;
      padding: 10px 15px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 2px;
    }
    .cart-btn {
      background-color: #fb641b;
    }
  </style>
</head>
<body>

  <header>
    <h2>Iqbal Mart</h2>
    <button class="cart-btn" onclick="openCart()">Cart (<span id="cart-count">0</span>)</button>
  </header>

  <div class="container">
    <h3>Products</h3>
    <div id="product-list"></div>
  </div>

  <div id="cart-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
    <div style="background:white; max-width:400px; margin:50px auto; padding:20px; border-radius:5px;">
      <h3>Your Cart</h3>
      <div id="cart-items"></div>
      <h4>Total: ₹<span id="cart-total">0</span></h4>
      <button onclick="proceedToCheckout()">PAY VIA RAZORPAY</button>
      <button onclick="closeCart()" style="background:#878787; margin-left:10px;">Close</button>
    </div>
  </div>

  <script>
    // Live Razorpay Key ID configured directly
    const RAZORPAY_KEY_ID = "rzp_live_Tm8vKEh9DrutliN";
    const COMMISSION_PERCENT = 5;

    let products = [
      { id: 1, name: "Switch", price: 10 },
      { id: 2, name: "Shopping Bag", price: 50 }
    ];

    let cart = JSON.parse(localStorage.getItem("iqbal_cart")) || [];
    let orders = JSON.parse(localStorage.getItem("iqbal_orders")) || [];

    function renderProducts() {
      const list = document.getElementById("product-list");
      list.innerHTML = "";
      products.forEach(p => {
        list.innerHTML += `
          <div class="product-card">
            <div>
              <strong>${p.name}</strong><br>₹${p.price}
            </div>
            <button onclick="addToCart(${p.id})">Add to Cart</button>
          </div>
        `;
      });
    }

    function addToCart(id) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += 1;
      } else {
        cart.push({ id: id, qty: 1 });
      }
      saveCart();
      alert("Added to cart!");
    }

    function saveCart() {
      localStorage.setItem("iqbal_cart", JSON.stringify(cart));
      updateCartCount();
    }

    function updateCartCount() {
      document.getElementById("cart-count").innerText = cart.reduce((sum, i) => sum + i.qty, 0);
    }

    function openCart() {
      document.getElementById("cart-modal").style.display = "block";
      const itemsDiv = document.getElementById("cart-items");
      itemsDiv.innerHTML = "";
      let total = 0;
      cart.forEach(item => {
        const p = products.find(prod => prod.id === item.id);
        if (p) {
          const cost = p.price * item.qty;
          total += cost;
          itemsDiv.innerHTML += `<div>${p.name} x ${item.qty} = ₹${cost}</div>`;
        }
      });
      document.getElementById("cart-total").innerText = total;
    }

    function closeCart() {
      document.getElementById("cart-modal").style.display = "none";
    }

    async function proceedToCheckout() {
      if (!cart.length) { alert("Cart is empty"); return; }
      let total = 0;
      let orderItems = [];
      cart.forEach(item => {
        const p = products.find(prod => prod.id == item.id);
        if (p) {
          const itemTotal = p.price * item.qty;
          total += itemTotal;
          const commission = itemTotal * (COMMISSION_PERCENT / 100);
          orderItems.push({ name: p.name, price: p.price, qty: item.qty, total: itemTotal, commission, sellerEarnings: itemTotal - commission });
        }
      });

      try {
        var options = {
          "key": RAZORPAY_KEY_ID,
          "amount": total * 100,
          "currency": "INR",
          "name": "Iqbal Mart",
          "description": "Secure Checkout",
          "handler": function (response) {
            const order = { id: "ORD" + Date.now(), date: new Date().toLocaleString(), items: orderItems, total, paymentId: response.razorpay_payment_id };
            orders.unshift(order);
            localStorage.setItem("iqbal_orders", JSON.stringify(orders));
            cart = []; saveCart(); updateCartCount(); closeCart();
            alert("✅ Order Successful! Payment ID: " + response.razorpay_payment_id);
          },
          "theme": { "color": "#2874f0" }
        };
        var rzp1 = new Razorpay(options);
        rzp1.open();
      } catch (error) {
        alert("❌ Payment initialization failed: " + error.message);
      }
    }

    renderProducts();
    updateCartCount();
  </script>
</body>
</html>
